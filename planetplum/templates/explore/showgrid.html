<div class="shows">

{% for show in shows %}

    <div class="show">
            <h2>{{ show.date|date:"D, M. jS" }}</h2>


            <a href="{{ show.get_absolute_url }}">
            <div class="show-img-container">
                <img src="{{ show.image.url }}" loading="lazy" style="object-fit:contain">
            </div>
        </a>

        
        <h3>
            at 
            {% if show.venue %}<a href="{{ show.venue.get_absolute_url }}">
                {{ show.venue.name }}
            </a>{% else %}
            {{ show.location }}
            {% endif %}
        </h3>     
    </div>
{% endfor %}</div>
